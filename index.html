<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07080d" />
    <meta name="description" content="The Arena — a 31-day RPG calisthenics training app. Complete missions, earn XP, rank up." />
    <title>The Arena</title>

    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <!-- iOS standalone mode -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="The Arena" />

    <!-- iOS launch screens (portrait) -->
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="./splash/splash-1290x2796.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="./splash/splash-1179x2556.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="./splash/splash-1170x2532.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" href="./splash/splash-1284x2778.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" href="./splash/splash-1125x2436.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" href="./splash/splash-828x1792.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" href="./splash/splash-750x1334.png" />

    <style>
      /* Inline boot splash: visible instantly, before JS loads. */
      html, body { margin: 0; background: #07080d; }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        color: #c9d4ff; font: 600 13px/1 -apple-system, system-ui, sans-serif;
        letter-spacing: .35em; text-transform: uppercase;
      }
      #boot .sigil {
        width: 88px; height: 88px; filter: drop-shadow(0 0 16px #6e7cff88);
        animation: bootpulse 1.4s ease-in-out infinite;
      }
      @keyframes bootpulse { 50% { transform: scale(.92); opacity: .6; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot"><img class="sigil" src="./logo.svg" alt="" />The Arena</div>
    </div>
    <script>
      /* If a static host (e.g. GitHub Pages) serves this SOURCE page instead of the built app,
         jump to the built app in ./docs/. Skipped in the Vite dev server (it injects @vite/client)
         and in the built docs/index.html (which doesn't contain this script). */
      (function () {
        if (document.querySelector('script[src*="@vite/client"]') || location.pathname.indexOf('/docs/') !== -1) return;
        if (document.querySelector('script[src*="assets/index-"]')) return; // this IS the built app
        if (location.port === '5173') return;
        fetch('./docs/index.html', { method: 'HEAD', cache: 'no-store' })
          .then(function (r) { if (r.ok) location.replace('./docs/' + location.search + location.hash); })
          .catch(function () {});
      })();
    </script>
    <script type="module" src="./src/main.jsx"></script>
    <script>
      /* Boot watchdog: if the app hasn't started after 7s, explain why instead of hanging on the logo. */
      (function () {
        function help() {
          var boot = document.getElementById('boot');
          if (!boot || window.__arenaStarted) return;
          var unbuilt = !!document.querySelector('script[src$="main.jsx"]');
          var reason = location.protocol === 'file:'
            ? 'The app was opened as a local file. Run <code>npm run dev</code>, or open the deployed site URL.'
            : unbuilt
              ? 'This server is serving the <b>source code</b> and no built app was found next to it.<br><br>On GitHub: make sure the <b>docs</b> folder is at the <b>top level</b> of the repo (not inside another folder), then Settings → Pages → Branch <b>main</b>, folder <b>/docs</b>.'
              : 'The app files could not load (old cache or a bad connection).';
          boot.innerHTML = '<img class="sigil" src="./logo.svg" alt="" style="animation:none" />' +
            '<div style="max-width:320px;text-align:center;letter-spacing:0;text-transform:none;font-weight:400;font-size:14px;line-height:1.5;color:#aab2d0">' +
            '<b style="color:#eef1ff;font-size:16px">The Arena couldn’t start</b><br><br>' + reason +
            '<br><br><button id="arena-fix" style="padding:12px 18px;border-radius:12px;border:0;background:#5b6cff;color:#fff;font-weight:700">Clear cache &amp; reload</button>' +
            '<br><small style="display:block;margin-top:10px;color:#6f789a">Your saved progress is kept.</small></div>';
          document.getElementById('arena-fix').onclick = function () {
            var jobs = [];
            if ('serviceWorker' in navigator) jobs.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
            if (window.caches) jobs.push(caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }));
            Promise.all(jobs).finally(function () { location.reload(); });
          };
        }
        setTimeout(help, 7000);
      })();
    </script>
  </body>
</html>
